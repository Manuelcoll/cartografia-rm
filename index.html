const X=l=>(l+180)/360*W,Y=a=>(90-a)/180*H,N=x=>((x%360)+540)%360-180,R=Math.PI/180;
function mk(box,arr,st,key){const d=document.getElementById(box);arr.forEach(p=>{const s=document.createElement('span');s.className='chip';
 const col=p[3]||'#888';s.style.setProperty('--c',col==='#000'?'#555':col);s.innerHTML=(p[3]?'<i></i>':'')+(p[1]&&p[3]?p[1]+' ':'')+p[0];
 const k=p[3]?p[2]:p[0];s.onclick=()=>{st[k]=!st[k];s.classList.toggle('off',!st[k]);draw()};d.appendChild(s)})}
mk('pl',P,on);mk('ln',L.map(l=>[l[0]]),lon);
document.querySelectorAll('#ln .chip').forEach((s,i)=>{if(!L[i][1])s.classList.add('off')});
function pos(b,t){const v=Astronomy.GeoVector(b,t,true);const e=Astronomy.EquatorFromVector(Astronomy.RotateVector(Astronomy.Rotation_EQJ_EQD(t),v));return{ra:e.ra*15,dec:e.dec}}
function stroke(pts,col,w,dash){
 const halo=col==='#000'?['rgba(255,255,255,.95)',w+4]:col==='#f2c200'?['rgba(0,0,0,.4)',w+2.5]:null;
 [halo,[col,w]].forEach(h=>{if(!h)return;c.strokeStyle=h[0];c.lineWidth=h[1];c.setLineDash(dash||[]);c.beginPath();let pr=null;
  pts.forEach(p=>{if(!p){pr=null;return}if(pr&&Math.abs(p[0]-pr[0])<180)c.lineTo(X(p[0]),Y(p[1]));else c.moveTo(X(p[0]),Y(p[1]));pr=p});c.stroke()});c.setLineDash([])}
function tag(t,x,y,col){c.font='bold 13px system-ui,sans-serif';const w=c.measureText(t).width+8;c.fillStyle='rgba(255,255,255,.88)';c.strokeStyle=col==='#000'?'#000':col;c.lineWidth=1.5;
 c.beginPath();c.roundRect(x-w/2,y-10,w,19,5);c.fill();c.stroke();c.fillStyle='#222';c.textAlign='center';c.fillText(t,x,y+4.5)}
function draw(){
 c.clearRect(0,0,W,H);c.fillStyle='#fdfcf9';c.fillRect(0,0,W,H);
 c.lineWidth=1;c.font='11px system-ui';c.fillStyle='rgba(0,0,0,.4)';c.textAlign='center';
 for(let l=-180;l<=180;l+=15){c.strokeStyle=l===0?'rgba(0,0,0,.2)':'rgba(0,0,0,.08)';c.beginPath();c.moveTo(X(l),0);c.lineTo(X(l),H);c.stroke();if(l%30===0&&l>-180&&l<180)c.fillText(l+'°',X(l),H-5)}
 c.textAlign='left';for(let a=-90;a<=90;a+=15){c.strokeStyle=a===0?'rgba(0,0,0,.2)':'rgba(0,0,0,.08)';c.beginPath();c.moveTo(0,Y(a));c.lineTo(W,Y(a));c.stroke();if(a%30===0&&a>-90&&a<90)c.fillText(a+'°',4,Y(a)-3)}
 c.drawImage(img,0,0,W,H);
 const v=document.getElementById('dt').value;if(!v)return;
 const t=Astronomy.MakeTime(new Date(v+':00Z')),gst=Astronomy.SiderealTime(t)*15;
 P.forEach((p,i)=>{if(!on[p[2]])return;const q=pos(p[2],t),col=p[3],mc=N(q.ra-gst),td=Math.tan(q.dec*R);
  if(lon.MC){stroke([[mc,90],[mc,-90]],col,3);tag(p[1]+' MC',X(mc),14+(i%3)*22,col)}
  if(lon.IC){const ic=N(mc+180);stroke([[ic,90],[ic,-90]],col,2.5,[10,7]);tag(p[1]+' IC',X(ic),H-14-(i%3)*22,col)}
  [['AC',-1],['DC',1]].forEach(([k,sg])=>{if(!lon[k])return;const pts=[];let lab=null;
   for(let a=-89;a<=89;a+=1){const z=-Math.tan(a*R)*td;if(Math.abs(z)>1){pts.push(null);continue}const h=sg*Math.acos(z)/R;const lg=N(q.ra+h-gst);pts.push([lg,a]);
    if(a===(k==='AC'?40:-40)-(i%3)*8)lab=[lg,a]}
   stroke(pts,col,3,k==='DC'?[10,7]:null);if(lab)tag(p[1]+' '+k,X(lab[0]),Y(lab[1]),col)});
  });
}
function setNow(){document.getElementById('dt').value=new Date().toISOString().slice(0,16);draw()}
document.getElementById('now').onclick=setNow;document.getElementById('dt').oninput=draw;
window.onresize=()=>{fit();draw()};fit();setNow();img.onload=draw;requestAnimationFrame(()=>{const w=cv.parentNode;w.scrollLeft=X(-90)-w.clientWidth/2});
